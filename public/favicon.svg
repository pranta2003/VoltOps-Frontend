<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="voltops-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="voltops-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.3" />
    </linearGradient>
  </defs>
  <!-- Base Container: Dark high-contrast rounded square -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="#06090e" stroke="url(#voltops-border)" stroke-width="1.5" />
  <!-- VoltOps Energy Bolt Symbol -->
  <polygon points="17 5 7 17 16 17 15 27 25 13 16 13 17 5" fill="url(#voltops-emerald)" stroke="#06090e" stroke-width="0.5" stroke-linejoin="round" />
